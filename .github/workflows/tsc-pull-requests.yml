name: "Typecheck pull requests"
on:
  pull_request:
    branches:
      - main

jobs:
  tsc:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2 # Current version of bun, see types specified in package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tsc
        run: bun run tsc
