name: Issue
description: Report a bug or request a feature/new utility
labels:
  - "Needs traige"
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's going wrong, or what would you like to see added?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (if applicable)
      description: How can this be reproduced? Include a minimal code sample if possible.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: input
    id: version
    attributes:
      label: Package version
      description: Which version of levy-utils are you using?
